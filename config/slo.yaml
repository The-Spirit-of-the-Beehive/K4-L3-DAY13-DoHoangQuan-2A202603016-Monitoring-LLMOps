service: day13-l3b-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  note: Dựa trên baseline giả định 10,000 request trong cửa sổ 28 ngày, target 99.5% tương ứng với error budget là 0.5%, nghĩa là tối đa 50 request được phép chậm hơn 3000ms hoặc gặp lỗi. Nếu số request vi phạm vượt quá 50, error budget bị cạn kiệt và đội ngũ kỹ thuật phải ngừng release tính năng mới để tập trung cải thiện độ trễ và độ tin cậy.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
